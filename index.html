<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Britani</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box}
html,body{height:100%;margin:0;background:#12030b;overflow:hidden;font-family:system-ui,sans-serif}
canvas{display:block;touch-action:none}
#hint{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;text-align:center;color:#ffe3c4;font-size:13px;opacity:.85;transition:opacity 2s;pointer-events:none}
#btn{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:50%;transform:translateX(-50%);background:#ffffff1c;border:1px solid #f5d38a;color:#ffe9c9;padding:9px 18px;border-radius:24px;font-size:14px;backdrop-filter:blur(6px);cursor:pointer;display:none}
#btn.show{display:block}
#btn.pulse{animation:pu 1.4s infinite}
@keyframes pu{50%{box-shadow:0 0 0 8px #f5d38a44}}
</style></head><body>
<div id="hint">Desliza hacia los lados para girar · pellizca para acercar</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const T=THREE,PHOTO="https://i.ibb.co/7dgmjkTR/IMG-4873.png",NAME="BRITA";
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),eo=p=>1-Math.pow(1-p,3),ob=p=>{const c=1.70158;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
const scene=new T.Scene();scene.background=new T.Color(0x12030b);scene.fog=new T.FogExp2(0x12030b,.018);
const asp=innerWidth/innerHeight,cam=new T.PerspectiveCamera(asp<1?60:50,asp,.1,120);
const dist=clamp(5.6/(Math.tan(cam.fov*Math.PI/360)*asp),15,27);cam.position.set(0,.9+dist*.14,dist);
const ren=new T.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);ren.outputEncoding=T.sRGBEncoding;document.body.appendChild(ren.domElement);
const ctl=new T.OrbitControls(cam,ren.domElement);ctl.target.set(0,.9,0);ctl.enableDamping=true;ctl.minDistance=3;ctl.enablePan=false;ctl.minPolarAngle=ctl.maxPolarAngle=Math.atan2(Math.hypot(cam.position.x,cam.position.z),cam.position.y-.9);ctl.maxDistance=36;
scene.add(new T.HemisphereLight(0xffd6e0,0x2a0a18,.85));
const dl=new T.DirectionalLight(0xffffff,1.1);dl.position.set(4,8,6);scene.add(dl);
const pl=new T.PointLight(0xff4d6d,1.4,16);pl.position.set(-3,2,3);scene.add(pl);
const wl=new T.PointLight(0xffd9b0,.9,14);wl.position.set(3,3,4);scene.add(wl);

function petalGeo(k,f,wv=.5){const g=new T.PlaneGeometry(1,1,12,14),p=g.attributes.position,col=[];
  for(let i=0;i<p.count;i++){const u=p.getX(i)*2,v=p.getY(i)+.5,w=Math.sin(Math.PI*(.1+.8*Math.pow(v,.7))),x=u*wv*w;
    p.setXYZ(i,x,v*1.2,-k*x*x+f*v*v*v+Math.sin(u*4+v*3)*.025*v);const c=.38+.62*v+.18*u*u*v;col.push(c,c*.88,c*.92)}
  g.setAttribute('color',new T.Float32BufferAttribute(col,3));g.computeVertexNormals();return g}
const mat=c=>new T.MeshPhysicalMaterial({color:c,vertexColors:true,roughness:.42,clearcoat:.35,clearcoatRoughness:.35,sheen:new T.Color(0xff6b8a),side:T.DoubleSide,emissive:0x240006});
const rose=new T.Group();scene.add(rose);const head=new T.Group();head.scale.setScalar(1.3);rose.add(head);
const LY=[
{n:3,s:.32,r:.03,o:.08,c:.03,k:2,f:0,col:0x7a0820},{n:4,s:.42,r:.06,o:.2,c:.06,k:1.8,f:.02,col:0x8f0a24},
{n:5,s:.54,r:.1,o:.4,c:.1,k:1.5,f:.06,col:0xa80f2b},{n:5,s:.66,r:.15,o:.62,c:.12,k:1.3,f:.12,col:0xbf1230},
{n:6,s:.78,r:.21,o:.85,c:.15,k:1.1,f:.22,col:0xd01535},{n:7,s:.9,r:.28,o:1.1,c:.18,k:.9,f:.35,col:0xdf1c3f},
{n:8,s:1.02,r:.36,o:1.38,c:.22,k:.75,f:.5,col:0xea2748}];
const pet=[];
LY.forEach((l,li)=>{const g=petalGeo(l.k,l.f),m=mat(l.col);
  for(let i=0;i<l.n;i++){const py=new T.Group(),px=new T.Group(),me=new T.Mesh(g,m),v=.92+Math.random()*.16;
    py.rotation.y=i/l.n*Math.PI*2+li*.7+(Math.random()-.5)*.25;px.position.z=l.r;px.add(me);py.add(px);head.add(py);
    pet.push({px,l,v,d:1.3+li*.4+i*.07,sd:Math.random()*6})}});
const green=new T.MeshStandardMaterial({color:0x1f8a4c,roughness:.55,side:T.DoubleSide,vertexColors:true});
for(let i=0;i<5;i++){const py=new T.Group(),px=new T.Group(),me=new T.Mesh(petalGeo(.5,.1),green);me.scale.set(.5,.8,1);
  py.rotation.y=i/5*Math.PI*2+.3;px.position.set(0,-.05,.1);px.rotation.x=2.3;px.add(me);py.add(px);head.add(py)}
const curve=new T.CatmullRomCurve3([new T.Vector3(0,-3.2,0),new T.Vector3(.15,-2.3,.1),new T.Vector3(-.1,-1.2,-.05),new T.Vector3(0,-.1,0)]);
const stem=new T.Mesh(new T.TubeGeometry(curve,40,.07,8,false),new T.MeshStandardMaterial({color:0x1f8a4c,roughness:.6}));rose.add(stem);
const sIdx=stem.geometry.index.count,leaves=[];
[[1.6,-1.9],[-1.6,-1.3]].forEach(a=>{const py=new T.Group(),px=new T.Group(),me=new T.Mesh(petalGeo(.9,.3),green);
  me.scale.set(.9,1.1,1);py.position.set(0,a[1],0);py.rotation.y=a[0];px.rotation.x=1.15;px.add(me);py.add(px);rose.add(py);leaves.push(px)});

function radTex(stops){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),r=g.createRadialGradient(64,64,0,64,64,64);stops.forEach(s=>r.addColorStop(s[0],s[1]));g.fillStyle=r;g.fillRect(0,0,128,128);return new T.CanvasTexture(c)}
const gr=new T.Mesh(new T.CircleGeometry(6,64),new T.MeshBasicMaterial({map:radTex([[0,'rgba(255,77,109,.5)'],[1,'rgba(255,77,109,0)']]),transparent:true,depthWrite:false,fog:false}));
gr.rotation.x=-Math.PI/2;gr.position.y=-3.2;scene.add(gr);
const N=140,sp=new Float32Array(N*3);for(let i=0;i<N*3;i+=3){sp[i]=(Math.random()-.5)*20;sp[i+1]=Math.random()*12-4;sp[i+2]=(Math.random()-.5)*20}
const spg=new T.BufferGeometry();spg.setAttribute('position',new T.BufferAttribute(sp,3));
scene.add(new T.Points(spg,new T.PointsMaterial({size:.16,map:radTex([[0,'#fff'],[.4,'rgba(255,225,190,.6)'],[1,'rgba(255,225,190,0)']]),transparent:true,depthWrite:false,blending:T.AdditiveBlending,fog:false})));
const fall=[],fm=mat(0xc3132f),fg=petalGeo(1.2,.2);
for(let i=0;i<14;i++){const m=new T.Mesh(fg,fm);m.scale.setScalar(.2);m.visible=false;m.userData={x:(Math.random()-.5)*9,z:(Math.random()-.5)*9,y:Math.random()*9-3,s:Math.random()*6,r:Math.random()+.3};scene.add(m);fall.push(m)}

/* Foto + nombre */
const ph=new T.Group(),inner=new T.Group();ph.add(inner);scene.add(ph);
function ph0(){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d'),r=g.createLinearGradient(0,0,256,256);r.addColorStop(0,'#ff8fab');r.addColorStop(1,'#c9184a');g.fillStyle=r;g.fillRect(0,0,256,256);g.fillStyle='#fff';g.textAlign='center';g.font='110px sans-serif';g.fillText('💗',128,150);return new T.CanvasTexture(c)}
const pm=new T.MeshBasicMaterial({map:ph0(),toneMapped:false,transparent:true});
const frame=new T.Mesh(new T.RingGeometry(1.15,1.3,64),new T.MeshBasicMaterial({color:0xf5d38a,transparent:true}));frame.position.z=.01;
const glow=new T.Sprite(new T.SpriteMaterial({map:radTex([[0,'rgba(255,150,160,.8)'],[1,'rgba(255,150,160,0)']]),transparent:true,depthWrite:false,blending:T.AdditiveBlending,fog:false}));glow.scale.set(5.5,5.5,1);glow.position.z=-.05;
const pulse=new T.Mesh(new T.RingGeometry(1.3,1.36,64),new T.MeshBasicMaterial({color:0xf5d38a,transparent:true,opacity:0}));
inner.add(new T.Mesh(new T.CircleGeometry(1.15,64),pm),frame,glow,pulse);ph.visible=false;
function nameTex(){const c=document.createElement('canvas');c.width=1280;c.height=256;const g=c.getContext('2d');
  const items=['\u2764\uFE0F',...'BRITANI','\u2764\uFE0F'],sp=22,ft=i=>i===0||i===items.length-1?'96px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif':'700 130px Cinzel,"Times New Roman",serif';
  g.textBaseline='middle';const ws=items.map((x,i)=>{g.font=ft(i);return g.measureText(x).width}),tw=ws.reduce((a,b)=>a+b,0)+sp*(items.length-1);
  let x=640-tw/2;const gd=g.createLinearGradient(0,60,0,200);gd.addColorStop(0,'#f1d89c');gd.addColorStop(.5,'#d4a437');gd.addColorStop(1,'#946510');
  g.shadowColor='rgba(0,0,0,.55)';g.shadowBlur=6;g.shadowOffsetY=3;g.lineWidth=5;g.lineJoin='round';g.strokeStyle='rgba(60,25,0,.85)';
  items.forEach((ch,i)=>{g.font=ft(i);if(i>0&&i<items.length-1){g.strokeText(ch,x,130);g.fillStyle=gd}g.fillText(ch,x,130);x+=ws[i]+sp});
  const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;return t}
const nm=new T.SpriteMaterial({transparent:true,depthWrite:false,fog:false,opacity:0}),nameS=new T.Sprite(nm);nameS.scale.set(5.6,1.12,1);nameS.position.set(0,2.05,0);ph.add(nameS);
function setPhoto(img){const tx=new T.Texture(img);tx.encoding=T.sRGBEncoding;const a=img.width/img.height;
  if(a>1){tx.repeat.x=1/a;tx.offset.x=(1-1/a)/2}else{tx.repeat.y=a;tx.offset.y=(1-a)/2}
  tx.needsUpdate=true;pm.map=tx;pm.needsUpdate=true}
const im=new Image();im.crossOrigin='anonymous';im.onload=()=>setPhoto(im);im.src=PHOTO;

/* Frases: un solo círculo */
const ALL=["mi amor","mi preciosa","mi princesa","eres la mejor","gracias por ser mi amiga","te quiero","mi cielo","mi reina","mi vida","mi tesoro","eres hermosa","te adoro","eres mi todo","mi corazón","mi persona favorita","eres increíble","me haces feliz","eres única"];
function wordTex(txt){const c=document.createElement('canvas');c.width=768;c.height=288;const g=c.getContext('2d');
  const w=txt.split(' '),m=Math.ceil(w.length/2),L=txt.length>14?[w.slice(0,m).join(' '),w.slice(m).join(' ')]:[txt];
  let s=L.length>1?86:100;const f=()=>`600 ${s}px Montserrat,system-ui,sans-serif`;g.font=f();
  while(Math.max(...L.map(x=>g.measureText(x).width))>720){s-=4;g.font=f()}
  g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
  L.forEach((x,i)=>{const y=144+(i-(L.length-1)/2)*s*.98;
    g.shadowColor='rgba(255,90,130,.9)';g.shadowBlur=26;g.lineWidth=14;g.strokeStyle='rgba(60,0,22,.95)';g.strokeText(x,384,y);
    g.shadowBlur=0;const gd=g.createLinearGradient(0,y-s/2,0,y+s/2);gd.addColorStop(0,'#ffffff');gd.addColorStop(1,'#ffd9e4');g.fillStyle=gd;g.fillText(x,384,y)});
  const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;t.anisotropy=8;return t}
const R=4.3,RN=7,RY=-1.9,RW=3.5,words=[],rg=new T.Group();scene.add(rg);
const guide=new T.Mesh(new T.TorusGeometry(R,.018,8,160),new T.MeshBasicMaterial({color:0xf5d38a,transparent:true,opacity:0,fog:false}));guide.rotation.x=Math.PI/2;guide.position.y=RY-.95;scene.add(guide);
const pick=()=>{const s=words.map(w=>w.txt),c=ALL.filter(x=>!s.includes(x));return c[Math.floor(Math.random()*c.length)]};
function build(){for(let k=0;k<RN;k++){const a=k/RN*Math.PI*2,sm=new T.SpriteMaterial({transparent:true,depthWrite:false,fog:false,opacity:0}),s=new T.Sprite(sm);
  s.position.set(R*Math.sin(a),RY,R*Math.cos(a));s.scale.set(RW,RW*.375,1);
  const o={sm,txt:pick(),ea:0,sa:1,fade:0,d:3.4+k*.18};sm.map=wordTex(o.txt);words.push(o);rg.add(s)}}
const fl=['600 60px Montserrat','700 60px Cinzel'].map(f=>document.fonts&&document.fonts.load?document.fonts.load(f):Promise.resolve());
Promise.race([Promise.all(fl),new Promise(r=>setTimeout(r,2500))]).catch(()=>{}).then(()=>{nm.map=nameTex();nm.needsUpdate=true;build();
  setInterval(()=>{const o=words[Math.floor(Math.random()*words.length)];if(o&&o.fade===0&&o.ea>.9)o.fade=-1},1600)});

let t=0,last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;t+=dt;
  stem.geometry.setDrawRange(0,Math.floor(sIdx*eo(clamp(t/1.6))/6)*6);
  leaves.forEach((l,i)=>l.scale.setScalar(Math.max(ob(clamp((t-1.2-i*.3)/1.2)),.001)));
  pet.forEach(p=>{const e=eo(clamp((t-p.d)/2.4)),sc=p.l.s*p.v*(.3+.7*e)*(t>p.d?1:0);
    p.px.scale.setScalar(Math.max(sc,.001));p.px.rotation.x=p.l.c+(p.l.o-p.l.c)*e+Math.sin(t*.9+p.sd)*.025*e});
  rose.rotation.z=Math.sin(t*.6)*.025;
  if(t>3.8){ph.visible=true;const p=clamp((t-3.8)/2.4),e=ob(p);inner.scale.setScalar(Math.max(e,.001));
    inner.rotation.z=(1-eo(p))*Math.PI*3;pm.opacity=clamp(p*3);frame.material.opacity=pm.opacity;
    ph.position.set(0,1.5+eo(p)*2.2+Math.sin(t*1.3)*.08*p,0);
    const q=clamp((t-4.9)/1.6);pulse.scale.setScalar(1+q*2.5);pulse.material.opacity=q>0&&q<1?(1-q)*.8:0;
    const n=clamp((t-5.4)/1.4);nm.opacity=eo(n);nameS.scale.set(5.6*(.7+.3*ob(n)),1.12*(.7+.3*ob(n)),1);ph.lookAt(cam.position)}
  rg.rotation.y-=dt*.13;const gs=.3+.7*eo(clamp((t-3.2)/2.5));rg.scale.set(gs,1,gs);
  guide.scale.set(gs,gs,1);guide.material.opacity=.55*eo(clamp((t-3.6)/2));
  words.forEach(o=>{o.ea=clamp((t-o.d)/1.2);
    if(o.fade<0){o.sa-=dt*1.6;if(o.sa<=0){o.sa=0;o.txt=pick();o.sm.map.dispose();o.sm.map=wordTex(o.txt);o.sm.needsUpdate=true;o.fade=1}}
    else if(o.fade>0){o.sa+=dt*1.6;if(o.sa>=1){o.sa=1;o.fade=0}}
    o.sm.opacity=o.ea*o.sa});
  fall.forEach(m=>{const d=m.userData;m.visible=t>4.5;d.y-=dt*.35;if(d.y<-3.1)d.y=7;m.position.set(d.x+Math.sin(t*.7+d.s)*.6,d.y,d.z);m.rotation.set(t*d.r,t*d.r*.7,d.s)});
  const a=spg.attributes.position;for(let i=1;i<N*3;i+=3){a.array[i]+=dt*.2;if(a.array[i]>8)a.array[i]=-4}a.needsUpdate=true;
  ctl.update();ren.render(scene,cam)}
requestAnimationFrame(loop);
setTimeout(()=>document.getElementById('hint').style.opacity=0,7000);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
</script></body></html>
